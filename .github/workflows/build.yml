name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle wrapper
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.9.0/gradle/wrapper/gradle-wrapper.jar
          curl -fsSL -o gradlew \
            https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew
          chmod +x gradlew

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | tr -d ' \r\n' | base64 --decode > app/google-services.json

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > app/release.jks

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Build Release APK
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APK_NAME=$(basename "$APK")
          BUILT_AT=$(TZ='Europe/Paris' date '+%Y-%m-%d %H:%M Paris')
          COMMIT_SHA="${{ github.sha }}"

          mkdir -p /tmp/gh-pages
          cp "$APK" /tmp/gh-pages/HealthTracker-release.apk

          cat > /tmp/gh-pages/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>HealthTracker</title>
            <style>
              body { font-family: sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; }
              h1 { font-size: 1.6rem; }
              .btn { display: inline-block; margin-top: 20px; padding: 14px 28px; background: #2ea44f;
                     color: #fff; text-decoration: none; border-radius: 6px; font-size: 1rem; }
              .btn:hover { background: #22863a; }
              .meta { margin-top: 16px; color: #666; font-size: 0.9rem; }
            </style>
          </head>
          <body>
            <h1>HealthTracker</h1>
            <p>Android release build — latest from <code>main</code>.</p>
            <a class="btn" href="HealthTracker-release.apk" download>Download APK</a>
            <p class="meta">Built: $BUILT_AT &nbsp;|&nbsp; Commit: <a href="https://github.com/${{ github.repository }}/commit/$COMMIT_SHA">${COMMIT_SHA:0:7}</a></p>
          </body>
          </html>
          EOF

          cd /tmp/gh-pages
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "deploy: $BUILT_AT (${COMMIT_SHA:0:7})"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin gh-pages --force
